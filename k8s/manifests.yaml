apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: offeria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      containers:
        - name: audit-service
          image: offeria/audit-service:latest
          ports:
            - containerPort: 8081
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: offeria
spec:
  selector:
    app: audit-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-service-config
  namespace: offeria
data:
  SPRING_PROFILES_ACTIVE: "prod"
